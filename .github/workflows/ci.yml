name: repository-contract

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.21"
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # The public CI contract is CPU/unit-only. The dedicated locked group
      # deliberately excludes the CUDA project runtime used on the RTX 5070.
      - name: Install locked CPU audit dependencies
        run: uv sync --frozen --only-group ci --no-install-project
      - name: Install pinned CPU Torch for synthetic controller tests
        run: >-
          uv pip install --python .venv/bin/python
          torch==2.11.0
          --index-url https://download.pytorch.org/whl/cpu
      - run: uv run --no-sync pytest tests/reproducibility -q
      - name: Test paper evidence and roster-screen reporting logic
        run: >-
          uv run --no-sync pytest tests/experiments/test_paper_grade_evidence.py -q
          -k "not east_support_roster_relabels_to_hdf5_authoritative_15d_95n"
      - name: Test fixed-shape runner and controller contracts
        run: >-
          uv run --no-sync pytest -q
          tests/experiments/test_unified_online_runner.py
          tests/experiments/test_two_timescale_online_adapter.py
          tests/experiments/test_east_private_continual.py
          tests/experiments/test_online_timescale_ablation.py
          -k "fixed_compute or selector_compute_control or fixed_query"
      - name: Regenerate hash-bound tables and figures
        run: |
          uv run --no-sync python experiments/transfer_methods_2026/paper_grade_package/scripts/generate_latex_tables.py
          git diff --exit-code -- experiments/transfer_methods_2026/paper_grade_package/manuscript/tables
          FUSION_FIGURE_DIR="$RUNNER_TEMP/regenerated-figures" uv run --no-sync python experiments/transfer_methods_2026/paper_grade_package/scripts/generate_figures.py
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from PIL import Image

          committed = json.loads(Path(
              "experiments/transfer_methods_2026/paper_grade_package/figures/figure_manifest.json"
          ).read_text())
          root = Path(os.environ["RUNNER_TEMP"]) / "regenerated-figures"
          rebuilt = json.loads((root / "figure_manifest.json").read_text())
          expected = {
              name for row in committed["figures"].values()
              for name in row["outputs"]
          }
          actual = {
              name for row in rebuilt["figures"].values()
              for name in row["outputs"]
          }
          assert rebuilt["schema_version"] == committed["schema_version"]
          assert len(rebuilt["figures"]) == 12
          assert actual == expected
          assert sum(name.endswith(".pdf") for name in actual) == 12
          assert sum(name.endswith(".svg") for name in actual) == 12
          assert sum(name.endswith(".png") for name in actual) == 12
          for row in rebuilt["figures"].values():
              for name, expected_hash in row["outputs"].items():
                  path = root / name
                  assert path.is_file() and path.stat().st_size > 1_000
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == expected_hash
                  if path.suffix == ".png":
                      with Image.open(path) as image:
                          assert image.format == "PNG"
                          assert min(image.size) >= 1_000
                  elif path.suffix == ".svg":
                      assert "<svg" in path.read_text()[:1_000]
                  elif path.suffix == ".pdf":
                      assert path.read_bytes().startswith(b"%PDF-")
          print("cross-platform figure reconstruction: PASS")
          PY
      - name: Validate archived paper evidence
        run: uv run --no-sync python experiments/transfer_methods_2026/paper_grade_package/scripts/validate_paper_package.py
      - name: Compile manuscripts from committed sources
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: experiments/transfer_methods_2026/paper_grade_package/manuscript
          root_file: |
            main.tex
            supplement.tex
          latexmk_use_xelatex: true
      - name: Confirm missing data fails closed
        run: |
          set +e
          uv run --no-sync python -m reproducibility.cli audit --data-root "$RUNNER_TEMP/no-data" > audit.out 2> audit.err
          code=$?
          test "$code" -ne 0
          grep -q "missing required data directory" audit.err
