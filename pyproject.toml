[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jtext-east-transfer"
version = "1.0.0"
description = "Reproducible J-TEXT to EAST transfer and chronological online adaptation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.4.6",
  "scipy==1.17.1",
  "pandas==2.2.3",
  "scikit-learn==1.5.2",
  "h5py==3.15.1",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "joblib==1.5.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[project.scripts]
fusion-reproduce = "reproducibility.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["reproducibility*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

# The locked CUDA wheels are selected explicitly so the documented environment
# is the same one used for the published reference run on RTX 5070.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
